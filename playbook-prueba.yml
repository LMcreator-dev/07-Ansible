---
- name: Mi primer playbook de Ansible
  hosts: local
  gather_facts: false

  tasks:
    - name: Mostrar un mensaje
      ansible.builtin.debug:
        msg: "Ansible funciona correctamente"

    - name: Consultar el tiempo encendido del servidor
      ansible.builtin.command: uptime
      register: resultado_uptime
      changed_when: false

    - name: Mostrar el resultado de uptime
      ansible.builtin.debug:
        var: resultado_uptime.stdout
