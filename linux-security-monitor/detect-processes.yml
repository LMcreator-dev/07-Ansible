---
- name: Detectar procesos que requieren revisión
  hosts: local
  gather_facts: false

  vars:
    reports_dir: "{{ playbook_dir }}/reports"

  tasks:
    - name: Asegurar que el directorio de informes está protegido
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: '0700'

    - name: Ejecutar detector de procesos
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/scripts/detect-suspicious-processes.sh"
      register: detection_result
      changed_when: false
      failed_when: detection_result.rc not in [0, 1]

    - name: Guardar resultado de la detección
      ansible.builtin.copy:
        content: |
          Fecha: {{ lookup('pipe', 'date "+%Y-%m-%d %H:%M:%S"') }}
          Código de salida: {{ detection_result.rc }}

          {{ detection_result.stdout }}
          {% if detection_result.stderr | length > 0 %}
          Errores:
          {{ detection_result.stderr }}
          {% endif %}
        dest: "{{ reports_dir }}/detection_{{ lookup('pipe', 'date +%Y-%m-%d_%H-%M-%S') }}.txt"
        mode: '0600'
      register: saved_report

    - name: Mostrar resultado de la detección
      ansible.builtin.debug:
        msg:
          - "Código de salida: {{ detection_result.rc }}"
          - "{{ detection_result.stdout }}"
          - "Informe guardado en: {{ saved_report.dest }}"
