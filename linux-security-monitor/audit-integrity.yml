
---
- name: Auditar integridad de archivos
  hosts: local
  gather_facts: false

  vars:
    reports_dir: "{{ playbook_dir }}/reports"
    baseline_file: "{{ playbook_dir }}/baselines/files.sha256"
    monitored_file: "{{ playbook_dir }}/test-files/config.txt"

  tasks:
    - name: Proteger directorio de informes
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: '0700'

    - name: Consultar referencia guardada
      ansible.builtin.stat:
        path: "{{ baseline_file }}"
      register: baseline_info

    - name: Consultar archivo vigilado
      ansible.builtin.stat:
        path: "{{ monitored_file }}"
        checksum_algorithm: sha256
      register: current_file

    - name: Leer referencia SHA-256
      ansible.builtin.slurp:
        src: "{{ baseline_file }}"
      register: baseline_content
      when: baseline_info.stat.exists

    - name: Determinar resultado de la auditoría
      ansible.builtin.set_fact:
        integrity_status: >-
          {% if not baseline_info.stat.exists %}
          ERROR: no existe la referencia
          {% elif not current_file.stat.exists %}
          ALERTA: archivo eliminado
          {% elif current_file.stat.checksum != (baseline_content.content | b64decode).split()[0] %}
          ALERTA: archivo modificado
          {% else %}
          OK: archivo sin cambios
          {% endif %}

    - name: Guardar informe de auditoría
      ansible.builtin.copy:
        content: |
          Fecha: {{ lookup('pipe', 'date "+%Y-%m-%d %H:%M:%S"') }}
          Archivo: {{ monitored_file }}
          Resultado: {{ integrity_status | trim }}
        dest: "{{ reports_dir }}/integrity_{{ lookup('pipe', 'date +%Y-%m-%d_%H-%M-%S') }}.txt"
        mode: '0600'

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: "{{ integrity_status | trim }}"
