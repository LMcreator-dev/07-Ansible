
---
- name: Comprobar integridad de archivos
  hosts: local
  gather_facts: false

  vars:
    baseline_file: "{{ playbook_dir }}/baselines/files.sha256"
    monitored_file: "{{ playbook_dir }}/test-files/config.txt"

  tasks:
    - name: Comprobar que existe la referencia
      ansible.builtin.stat:
        path: "{{ baseline_file }}"
      register: baseline_info

    - name: Detener si no existe la referencia
      ansible.builtin.fail:
        msg: "No existe la referencia SHA-256. Ejecute create-baseline.yml primero."
      when: not baseline_info.stat.exists

    - name: Leer la referencia guardada
      ansible.builtin.slurp:
        src: "{{ baseline_file }}"
      register: baseline_content

    - name: Calcular el hash actual del archivo
      ansible.builtin.stat:
        path: "{{ monitored_file }}"
        checksum_algorithm: sha256
      register: current_file

    - name: Detener si el archivo vigilado no existe
      ansible.builtin.fail:
        msg: "ALERTA: el archivo vigilado ya no existe."
      when: not current_file.stat.exists

    - name: Comparar el hash actual con la referencia
      ansible.builtin.assert:
        that:
          - current_file.stat.checksum == (baseline_content.content | b64decode).split()[0]
        success_msg: "OK: el archivo no ha cambiado."
        fail_msg: "ALERTA: el contenido del archivo ha cambiado."
