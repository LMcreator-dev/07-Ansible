---
- name: Install Linux Security Monitor on this server
  hosts: linux_security
  gather_facts: true
  become: false
  vars:
    lsm_selected_modules: all
  pre_tasks:
    - name: Load configuration for this server hostname
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/host_vars/{{ ansible_hostname }}.yml"
      tags: always
    - name: Inspect project directory owner for report access
      ansible.builtin.stat:
        path: "{{ playbook_dir }}"
      register: lsm_project_directory
      tags: always
    - name: Use project directory owner for private reports
      ansible.builtin.set_fact:
        lsm_report_owner: "{{ lsm_project_directory.stat.pw_name | default(ansible_user_id) }}"
      tags: always
    - name: Validate selected module name
      ansible.builtin.assert:
        that: lsm_selected_modules == 'all' or lsm_selected_modules in ['antivirus', 'integrity', 'processes', 'network', 'motd']
        fail_msg: "lsm_selected_modules debe ser all, antivirus, integrity, processes, network o motd."
      tags: always
    - name: Ensure the selected module is enabled for this server
      ansible.builtin.assert:
        that: lsm_selected_modules == 'all' or lsm_modules.get(lsm_selected_modules, false) | bool
        fail_msg: "El módulo {{ lsm_selected_modules }} está deshabilitado en las variables de este servidor."
      tags: always
    - name: Prepare shared report and state directories
      ansible.builtin.import_role:
        name: lsm_common
      tags: always
    - name: Install local command and per-host configuration
      ansible.builtin.import_role:
        name: lsm_common
        tasks_from: install
      tags: always
  tasks:
    - name: Install antivirus module and ClamAV
      ansible.builtin.import_role:
        name: lsm_antivirus
      when: lsm_modules.antivirus | default(false) | bool and (lsm_selected_modules == 'all' or lsm_selected_modules == 'antivirus')
      tags: [antivirus]
    - name: Install integrity module
      ansible.builtin.import_role:
        name: lsm_integrity
      when: lsm_modules.integrity | default(false) | bool and (lsm_selected_modules == 'all' or lsm_selected_modules == 'integrity')
      tags: [integrity]
    - name: Install process detection module
      ansible.builtin.import_role:
        name: lsm_processes
      when: lsm_modules.processes | default(false) | bool and (lsm_selected_modules == 'all' or lsm_selected_modules == 'processes')
      tags: [processes]
    - name: Install network module
      ansible.builtin.import_role:
        name: lsm_network
      when: lsm_modules.network | default(false) | bool and (lsm_selected_modules == 'all' or lsm_selected_modules == 'network')
      tags: [network]
    - name: Install dynamic MOTD
      ansible.builtin.import_role:
        name: lsm_motd
      when: lsm_modules.motd | default(false) | bool and (lsm_selected_modules == 'all' or lsm_selected_modules == 'motd')
      tags: [motd]
  post_tasks:
    - name: Check whether this server already has an integrity baseline
      ansible.builtin.stat:
        path: "{{ lsm_integrity.baseline_file }}"
      register: lsm_baseline_status
      become: true
      when:
        - not ansible_check_mode
        - lsm_modules.integrity | default(false) | bool
        - lsm_selected_modules in ['all', 'integrity']

    - name: Create the initial baseline only when none exists
      ansible.builtin.command:
        argv: [/usr/local/sbin/linux-security-monitor, integrity, create]
      register: lsm_baseline_creation
      changed_when: lsm_baseline_creation.rc == 0
      when:
        - not ansible_check_mode
        - lsm_modules.integrity | default(false) | bool
        - lsm_selected_modules in ['all', 'integrity']
        - not lsm_baseline_status.stat.exists
      become: true

    - name: Run enabled local monitor modules and write reports
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/linux-security-monitor
          - "{{ lsm_selected_modules }}"
      register: lsm_local_run
      changed_when: true
      failed_when: false
      when:
        - not ansible_check_mode
        - lsm_selected_modules != 'motd'
        - lsm_selected_modules == 'all' or lsm_modules.get(lsm_selected_modules, false) | bool
      become: true

    - name: Find reports generated by this run
      ansible.builtin.find:
        paths: "{{ lsm_reports_dir }}"
        patterns: ['*.txt', '*.json']
        file_type: file
        recurse: true
      register: lsm_local_report_files
      when: lsm_local_run is not skipped
      become: true

    - name: Ensure generated reports remain readable by the local operator only
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ lsm_report_owner | default(ansible_user_id) }}"
        mode: '0600'
      loop: "{{ lsm_local_report_files.files | default([]) }}"
      when: lsm_local_run is not skipped
      become: true

    - name: Restore local operator ownership on report directory
      ansible.builtin.file:
        path: "{{ lsm_reports_dir }}"
        owner: "{{ lsm_report_owner | default(ansible_user_id) }}"
        mode: '0700'
      when: lsm_local_run is not skipped
      become: true

    - name: Display local scan results
      ansible.builtin.debug:
        msg: "{{ lsm_local_run.stdout_lines | default([]) }}"
      when: lsm_local_run is not skipped

    - name: Fail the playbook if a module reported an alert or error
      ansible.builtin.assert:
        that: lsm_local_run.rc == 0
        fail_msg: >-
          El monitor terminó con código {{ lsm_local_run.rc }}. Revisa los resultados y los informes en
          {{ lsm_reports_dir }}.
        success_msg: "Módulos completados sin alertas. Informes en {{ lsm_reports_dir }}."
      when: lsm_local_run is not skipped
