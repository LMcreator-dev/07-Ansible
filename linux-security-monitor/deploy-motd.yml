---
- name: Configure dynamic Linux Security Monitor MOTD
  hosts: local
  gather_facts: false
  become: true

  tasks:
    - name: Deploy dynamic MOTD script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/scripts/linux-security-monitor-motd.sh"
        dest: /etc/update-motd.d/99-linux-security-monitor
        owner: root
        group: root
        mode: '0755'

    - name: Remove static MOTD to avoid duplicate banner
      ansible.builtin.file:
        path: /etc/motd
        state: absent
