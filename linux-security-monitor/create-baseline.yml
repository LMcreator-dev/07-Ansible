
---
- name: Crear referencia de integridad SHA-256
  hosts: local
  gather_facts: false

  vars:
    baseline_file: "{{ playbook_dir }}/baselines/files.sha256"
    monitored_file: "{{ playbook_dir }}/test-files/config.txt"

  tasks:
    - name: Crear directorio de referencias protegido
      ansible.builtin.file:
        path: "{{ playbook_dir }}/baselines"
        state: directory
        mode: '0700'

    - name: Calcular SHA-256 del archivo vigilado
      ansible.builtin.stat:
        path: "{{ monitored_file }}"
        checksum_algorithm: sha256
      register: file_info

    - name: Guardar referencia inicial
      ansible.builtin.copy:
        content: "{{ file_info.stat.checksum }}  {{ monitored_file }}\n"
        dest: "{{ baseline_file }}"
        mode: '0600'
      when: file_info.stat.exists
