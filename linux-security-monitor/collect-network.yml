
---
- name: Recopilar conexiones de red para Linux Security Monitor
  hosts: local
  gather_facts: false

  vars:
    reports_dir: "{{ playbook_dir }}/reports"

  tasks:
    - name: Crear directorio de informes con permisos seguros
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: '0700'

    - name: Ejecutar recopilador de conexiones de red
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/scripts/collect-network-connections.sh"
      register: network_result
      changed_when: false

    - name: Guardar informe de conexiones de red
      ansible.builtin.copy:
        content: "{{ network_result.stdout }}\n"
        dest: "{{ reports_dir }}/network_{{ lookup('pipe', 'date +%Y-%m-%d_%H-%M-%S') }}.txt"
        mode: '0600'

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg:
          - "Recopilación de red completada."
          - "Informe guardado en reports/."
          - "Vista previa:"
          - "{{ network_result.stdout_lines[:8] }}"
